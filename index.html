<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Soccer Stadium</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="game-box">
    <header class="top-bar">
      <div>
        <h1>⚽ Mini Soccer Stadium</h1>
        <p class="subtitle">Score past the defender and goalkeeper.</p>
      </div>

      <div class="game-settings">
        <label for="difficulty">Difficulty</label>

        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>

        <button id="soundButton" type="button" aria-label="Turn sound off">
          🔊
        </button>

        <button id="restartButton" type="button">
          Restart
        </button>
      </div>
    </header>

    <canvas id="gameCanvas" width="1200" height="780"></canvas>
  </main>

  <script src="game.js"></script>
</body>
</html>
